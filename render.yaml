# Render Blueprint —— 导入 GitHub 仓库即可一键部署「背诵宝」
# 用法：Render 控制台 → New → Blueprint → 连接本仓库，Deploy。
# 首次部署后需在 Render 控制台补充环境变量 DEEPSEEK_API_KEY（Sync: false 不会自动同步，手动填一次）。

services:
  - type: web
    name: article-recite
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
